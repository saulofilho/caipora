[project]
name = "caipora"
version = "0.1.0"
description = "Red teaming de LLMs com foco no Brasil: ataques em PT-BR, detectores de dados pessoais e LGPD."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["httpx>=0.27"]

[project.scripts]
caipora = "caipora.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caipora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
